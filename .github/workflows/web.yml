name: Web
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require backend URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$VITE_API_URL" || (echo "Set the VITE_API_URL repository variable before deploying the web app." && exit 1)
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (response.data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) return;
              core.info('Waiting for the uploaded Pages artifact to become visible...');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The uploaded Pages artifact did not become visible.');
      - uses: actions/deploy-pages@v5
