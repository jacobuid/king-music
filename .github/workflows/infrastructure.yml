name: Provision infrastructure
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: king-music-backend
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_SLUG: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Provision D1
        id: d1
        run: node scripts/provision-d1.mjs
      - name: Configure workers.dev
        id: workers
        run: node scripts/configure-cloudflare.mjs
      - name: Provision private music storage
        id: b2
        run: node scripts/provision-b2.mjs
        env:
          B2_BOOTSTRAP_KEY_ID: ${{ secrets.B2_BOOTSTRAP_KEY_ID }}
          B2_BOOTSTRAP_APPLICATION_KEY: ${{ secrets.B2_BOOTSTRAP_APPLICATION_KEY }}
          B2_BUCKET: ${{ github.repository_owner }}-${{ github.event.repository.name }}
          B2_KEY_PREFIX: ${{ github.event.repository.name }}-worker-
          WEB_ORIGIN: https://${{ github.repository_owner }}.github.io
          WEB_ORIGINS: https://${{ github.repository_owner }}.github.io,http://localhost:5173
      - name: Configure deployment
        run: node scripts/configure-deployment.mjs
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          B2_BUCKET: ${{ github.repository_owner }}-${{ github.event.repository.name }}
          WEB_ORIGIN: https://${{ github.repository_owner }}.github.io
          WEB_ORIGINS: https://${{ github.repository_owner }}.github.io,http://localhost:5173
          B2_ENDPOINT: ${{ steps.b2.outputs.endpoint }}
          B2_KEY_ID: ${{ steps.b2.outputs.key_id }}
          B2_APPLICATION_KEY: ${{ steps.b2.outputs.application_key }}
          APP_SIGNING_SECRET: ${{ secrets.APP_SIGNING_SECRET }}
          MUSIC_SERVICE_URL: ${{ secrets.MUSIC_SERVICE_URL }}
          MUSIC_SERVICE_TOKEN: ${{ secrets.MUSIC_SERVICE_TOKEN }}
          WRITE_SECRETS: 'true'
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config services/api/wrangler.jsonc
      - name: Install API secrets
        run: npx wrangler secret bulk services/api/.deployment-secrets.json --config services/api/wrangler.jsonc
      - name: Deploy API
        run: npm run deploy -w services/api
      - name: Verify readiness
        env:
          API_URL: https://${{ github.event.repository.name }}-api.${{ steps.workers.outputs.subdomain }}.workers.dev
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors "$API_URL/api/health"
          echo "API URL: $API_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean temporary credentials
        if: always()
        run: rm -f services/api/.deployment-secrets.json
