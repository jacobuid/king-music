name: API
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'scripts/configure-deployment.mjs', 'package.json', 'package-lock.json', '.github/workflows/api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: king-music-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check -w services/api
      - run: npm test
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config services/api/wrangler.jsonc
      - name: Deploy configured API
        run: npm run deploy -w services/api
      - name: Verify readiness
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors "$API_URL/api/health"
